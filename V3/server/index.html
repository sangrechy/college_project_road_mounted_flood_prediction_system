<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Sentry | Live Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES FOR THEME SWITCHING */
        :root {
            --bg: #f8f9fa; --card-bg: #ffffff; --text: #212529; --border: #dee2e6;
            --danger: #dc3545; --success: #198754; --warning: #ffc107; --shadow: rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333;
            --danger: #ff4757; --success: #2ed573; --warning: #eccc68; --shadow: rgba(0,0,0,0.5);
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* HEADER */
        .header {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--card-bg); opacity: 0.95; 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 2000; border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow);
        }
        .brand { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
        .controls { display: flex; gap: 10px; }
        
        button {
            border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s;
            background: var(--border); color: var(--text);
        }
        .btn-sos { background: var(--danger); color: white; animation: pulse 2s infinite; }
        .btn-theme { background: transparent; border: 1px solid var(--border); }
        /* NEW: Mute Button Styling */
        .btn-mute { background: transparent; border: 1px solid var(--border); font-weight: bold; }
        .btn-mute.muted { border-color: var(--danger); color: var(--danger); }

        /* MAP & PANELS */
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        .panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 600px; background: var(--card-bg);
            padding: 15px; border-radius: 12px; z-index: 1000; border: 1px solid var(--border);
            box-shadow: 0 5px 20px var(--shadow);
        }
        
        /* SOS OVERLAY */
        #sos-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(220, 53, 69, 0.9); z-index: 5000;
            flex-direction: column; justify-content: center; align-items: center; color: white;
            text-align: center; animation: flash 0.5s infinite alternate;
        }

        /* HISTORY MODAL */
        #history-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--card-bg); width: 500px; max-height: 80vh; overflow-y: auto;
            padding: 20px; border-radius: 12px;
        }
        .alert-item { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .alert-SOS { color: var(--danger); font-weight: bold; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
        @keyframes flash { from { opacity: 0.8; } to { opacity: 1; } }
        
        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper { border-radius: 8px; }
        .leaflet-popup-content { margin: 12px; }
        
        /* Arrow Styling */
        .arrow-icon { display: flex; justify-content: center; align-items: center; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div id="sos-overlay">
        <h1 style="font-size: 5rem; margin:0;">🆘</h1>
        <h1>EMERGENCY ALERT</h1>
        <p>FLOOD SOS TRIGGERED</p>
        <button onclick="dismissSOS()" style="background:white; color:red; font-size:1.2rem; padding:10px 30px;">DISMISS</button>
    </div>

    <div class="header">
        <div class="brand">🌊 FLOOD SENTRY</div>
        <div class="controls">
            <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🔊 ALARMS ON</button>
            <button class="btn-theme" onclick="toggleTheme()">🌗 THEME</button>
            <button class="btn-history" onclick="toggleHistory()">📜 HISTORY</button>
            <button class="btn-sos" onclick="triggerSOS()">🚨 SOS</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight: bold;">
            <span>AI Prediction Timeline</span>
            <span id="timeDisplay" style="color:var(--success)">LIVE DATA</span>
        </div>
        <input type="range" id="timeSlider" min="0" max="6" value="0" style="width:100%; cursor: pointer;">
    </div>

    <div id="history-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2>⚠️ Alert History</h2>
                <button onclick="toggleHistory()">CLOSE</button>
            </div>
            <div id="alert-list">Loading...</div>
        </div>
    </div>

    <script>
        const socket = io();
        const map = L.map('map', { zoomControl: false }).setView([12.9716, 77.5946], 15);
        
        // TILE LAYERS
        const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');
        const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
        
        let currentLayer = darkTiles; // Default
        currentLayer.addTo(map);

        const markers = {};
        let globalNodeData = {}; // Stores latest data for instant slider updates

        // 1. THEME SWITCHER
        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                map.removeLayer(darkTiles);
                lightTiles.addTo(map);
            } else {
                html.setAttribute('data-theme', 'dark');
                map.removeLayer(lightTiles);
                darkTiles.addTo(map);
            }
        }

        // 2. MUTE ALARMS TOGGLE
        let isMuted = false;
        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            btn.innerText = isMuted ? "🔇 ALARMS MUTED" : "🔊 ALARMS ON";
            if(isMuted) btn.classList.add('muted'); else btn.classList.remove('muted');
            
            // Tell the server to stop sending SOS popups
            fetch('/api/toggle-mute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mute: isMuted })
            });
        }

        // 3. SOS LOGIC
        function triggerSOS() {
            if(confirm("⚠️ ARE YOU SURE? This will alert ALL users.")) {
                socket.emit('sos-trigger', { msg: "Manual Alert" }); 
            }
        }
        socket.on('sos-broadcast', (alert) => {
            // Only show if not muted, OR if it's a manual trigger
            if (!isMuted || alert.type === "SOS") {
                document.getElementById('sos-overlay').style.display = 'flex';
            }
        });
        function dismissSOS() {
            document.getElementById('sos-overlay').style.display = 'none';
        }

        // 4. PREDICTION SLIDER LOGIC
        let isFutureMode = false;
        document.getElementById('timeSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            isFutureMode = (val > 0);
            const timeDisplay = document.getElementById('timeDisplay');
            
            if (isFutureMode) {
                timeDisplay.innerText = `+${val} HOURS (AI PREDICTED)`;
                timeDisplay.style.color = "var(--warning)";
            } else {
                timeDisplay.innerText = "LIVE DATA";
                timeDisplay.style.color = "var(--success)";
            }
            // Instantly redraw all markers with the new view
            Object.values(globalNodeData).forEach(updateMapMarker);
        });

        // 5. MAP UPDATES & COLOR LOGIC
        function getIcon(color, dir) {
            return L.divIcon({
                className: 'arrow-icon',
                // 👇 FIX APPLIED HERE: display: inline-block; transform-origin: center;
                html: `<div style="transform: rotate(${dir}deg); color: ${color}; font-size: 24px; display: inline-block; transform-origin: center;">➤</div>`,
                iconSize: [30, 30], iconAnchor: [15, 15]
            });
        }

        function generatePopupContent(data, color, activeDepth, usingAI) {
            const liveDepth = Math.max(0, 95 - data.s1).toFixed(1);
            
            let aiHtml = `<div style="margin-top: 10px; padding: 8px; background: rgba(0,0,0,0.05); border-radius: 6px;">
                            <i style="color: #666; font-size: 0.9em;">AI Forecast Unavailable</i>
                          </div>`;
            
            if (data.ai && data.ai.alert) {
                aiHtml = `
                    <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.03); border-radius: 6px; border-left: 4px solid ${data.ai.alert.color_code || 'gray'};">
                        <span style="color: #333; font-weight: 800; font-size: 0.85rem;">🔮 AI FORECAST</span><br>
                        <b style="font-size: 1.1rem; color: #212529;">${data.ai.alert.severity}</b><br>
                        <span style="color: #495057;">Expected Depth: <b>${data.ai.predictions.future_depth_cm} cm</b></span>
                    </div>
                `;
            }

            return `
                <div style="font-family: 'Inter', sans-serif; min-width: 200px; color: #212529;">
                    <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 5px; color: ${color}">Node: ${data.nodeId}</div>
                    ${usingAI ? `<div style="background:var(--warning); color:#000; font-size:0.75rem; padding:2px 5px; border-radius:4px; margin-bottom:5px; font-weight:bold;">PREDICTIVE VIEW ACTIVE</div>` : ''}
                    <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 8px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span>💧 Live Depth:</span> <b>${liveDepth} cm</b>
                    </div>
                    ${usingAI ? `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px; color:var(--danger); font-weight:bold;">
                        <span>🔮 Predicted Depth:</span> <b>${activeDepth} cm</b>
                    </div>` : ''}
                    <div style="display: flex; justify-content: space-between;">
                        <span>🌧️ Rain Sensor:</span> <b>${data.rain}</b>
                    </div>
                    ${aiHtml}
                </div>
            `;
        }

        // The core logic to update the map markers
        function updateMapMarker(data) {
            globalNodeData[data.nodeId] = data; // Save to global state
            
            let currentDepth = Math.max(0, 95 - data.s1);
            let displayDepth = currentDepth;
            let usingAI = false;

            // OVERRIDE WITH AI DATA IF SLIDER IS MOVED
            if (isFutureMode && data.ai && data.ai.predictions) {
                displayDepth = data.ai.predictions.future_depth_cm;
                usingAI = true;
            }

            // SEVERITY COLOR LOGIC (Works for both Live and AI)
            let color = "#2ed573"; // Green (Safe)
            if (displayDepth > 20) color = "#eccc68"; // Yellow (Caution)
            if (displayDepth > 40) color = "#ff7f50"; // Orange (Warning)
            if (displayDepth > 60) color = "#ff4757"; // Red (Severe)

            const pos = [data.lat, data.lon];
            const popupContent = generatePopupContent(data, color, displayDepth, usingAI);

            if (!markers[data.nodeId]) {
                markers[data.nodeId] = L.marker(pos, { icon: getIcon(color, data.flowDir) })
                    .addTo(map)
                    .bindPopup(popupContent);
            } else {
                markers[data.nodeId].setLatLng(pos)
                    .setIcon(getIcon(color, data.flowDir))
                    .setPopupContent(popupContent);
            }
        }

        // Listen for hardware updates
        socket.on('map-update', updateMapMarker);

        // 6. HISTORY MODAL
        async function toggleHistory() {
            const modal = document.getElementById('history-modal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                const res = await fetch('/api/alerts');
                const alerts = await res.json();
                document.getElementById('alert-list').innerHTML = alerts.map(a => `
                    <div class="alert-item">
                        <span class="alert-${a.type}"><b>${a.type}</b></span>
                        <span>${a.message}</span>
                        <span style="opacity:0.6; font-size:0.8rem;">${new Date(a.timestamp).toLocaleTimeString()}</span>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
